{% load mathfilters %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Light grey background */
            color: #212529; /* Dark text color for contrast */
        }
        .calendar-container {
            background-color: #ffffff; /* White container background */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .calendar {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .calendar th, .calendar td {
            text-align: center;
            padding: 10px;
            border: 1px solid #dee2e6; /* Light grey border color */
            vertical-align: top;
            height: 120px;
            position: relative;
        }
        .calendar th {
            background-color: #e9ecef; /* Lighter header background */
            color: #212529;
        }
        .calendar td {
            background-color: #ffffff; /* Match container background */
        }
        .calendar td .date {
            position: absolute;
            top: 5px;
            right: 5px;
            color: #6c757d; /* Muted grey for day number */
            font-weight: bold;
        }
        .calendar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .calendar li {
            margin-bottom: 5px;
        }
        .calendar a.event-link {
            font-size: 0.9em;
            word-wrap: break-word;
            color: #dc3545; /* Red for event links */
            transition: color 0.2s ease-in-out;
        }
        .calendar a.event-link:hover {
            color: #c82333; /* Darker red on hover */
        }
        .btn-primary-red {
            background-color: #dc3545; /* Red button */
            border-color: #dc3545;
            color: #fff;
            transition: background-color 0.2s ease-in-out;
        }
        .btn-primary-red:hover {
            background-color: #c82333; /* Darker red on hover */
            border-color: #c82333;
        }
        .btn-secondary-light {
            background-color: #e9ecef; /* Light grey secondary button */
            border-color: #e9ecef;
            color: #212529;
        }
        .btn-secondary-light:hover {
            background-color: #dee2e6; /* Slightly darker on hover */
            border-color: #dee2e6;
        }
        .calendar-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 calendar-container">
                <div class="calendar-heading">
                    <i class="bi bi-calendar-check-fill fs-2 text-danger"></i>
                    <h2 class="text-center text-danger">School Events Calendar</h2>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="?{{ prev_month }}" class="btn btn-secondary-light">Previous Month</a>
                    <span class="fs-4 text-dark">{{ month_name }} {{ month_year }}</span>
                    <a href="?{{ next_month }}" class="btn btn-secondary-light">Next Month</a>
                </div>
                <div class="d-flex justify-content-center my-4 gap-2">
                    <a class="btn btn-secondary-light" href="/dashboard/">Back to Dashboard</a>
                    {% if user.is_authenticated and user.is_staff %}
                    <a class="btn btn-primary-red" href="{% url 'events:event_new' %}">Add Event</a>
                    {% endif %}
                </div>
                {{ calendar|safe }}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
