{% load mathfilters %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1a26; /* Dark slate blue background */
            color: #f8f9fa; /* Light text color */
        }
        .calendar-container {
            background-color: #1a293a; /* Dark blue container background */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .calendar {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .calendar th, .calendar td {
            text-align: center;
            padding: 10px;
            border: 1px solid #3d4a5c; /* Slightly lighter border color for contrast */
            vertical-align: top;
            height: 120px;
            position: relative;
        }
        .calendar th {
            background-color: #112030; /* Darker header background */
            color: #fff;
        }
        .calendar td {
            background-color: #1a293a; /* Match container background */
        }
        .calendar td .date {
            position: absolute;
            top: 5px;
            right: 5px;
            color: #8c9bb0; /* Faded blue for day number */
            font-weight: bold;
        }
        .calendar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .calendar li {
            margin-bottom: 5px;
        }
        .calendar a.event-link {
            font-size: 0.9em;
            word-wrap: break-word;
            color: #ff914d; /* Bright orange for event links */
            transition: color 0.2s ease-in-out;
        }
        .calendar a.event-link:hover {
            color: #ffa566; /* Lighter orange on hover */
        }
        .btn-primary-orange {
            background-color: #ff5e00; /* Vibrant orange button */
            border-color: #ff5e00;
            color: #fff;
            transition: background-color 0.2s ease-in-out;
        }
        .btn-primary-orange:hover {
            background-color: #e65300; /* Darker orange on hover */
            border-color: #e65300;
        }
        .btn-secondary-dark {
            background-color: #2c3e50; /* Darker secondary button */
            border-color: #2c3e50;
            color: #fff;
        }
        .btn-secondary-dark:hover {
            background-color: #233140; /* Slightly darker on hover */
            border-color: #233140;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 calendar-container">
                <h2 class="text-center text-primary-orange">School Calendar</h2>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="?{{ prev_month }}" class="btn btn-secondary-dark">Previous Month</a>
                    <span class="fs-4 text-white">{{ month_name }} {{ month_year }}</span>
                    <a href="?{{ next_month }}" class="btn btn-secondary-dark">Next Month</a>
                </div>
                <div class="d-flex justify-content-center my-4 gap-2">
                    <a class="btn btn-secondary-dark" href="/dashboard">Back to Dashboard</a>
                    {% if user.is_authenticated and user.is_staff %}
                    <a class="btn btn-primary-orange" href="{% url 'events:event_new' %}">Add Event</a>
                    {% endif %}
                </div>
                {{ calendar|safe }}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
