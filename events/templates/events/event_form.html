{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Edit Event{% else %}Add Event{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1a26; /* Dark slate blue background */
            color: #f8f9fa; /* Light text color */
        }
        .card {
            background-color: #1a293a; /* Dark blue card background */
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .form-control {
            background-color: #2c3e50; /* Darker input fields */
            color: #fff;
            border: 1px solid #3d4a5c;
        }
        .form-control:focus {
            background-color: #2c3e50;
            color: #fff;
            border-color: #ff5e00; /* Orange focus outline */
            box-shadow: 0 0 0 0.25rem rgba(255, 94, 0, 0.25);
        }
        .btn-primary-orange {
            background-color: #ff5e00; /* Vibrant orange button */
            border-color: #ff5e00;
            color: #fff;
            transition: background-color 0.2s ease-in-out;
        }
        .btn-primary-orange:hover {
            background-color: #e65300; /* Darker orange on hover */
            border-color: #e65300;
        }
        .btn-secondary-dark {
            background-color: #2c3e50; /* Darker secondary button */
            border-color: #2c3e50;
            color: #fff;
        }
        .btn-secondary-dark:hover {
            background-color: #233140; /* Slightly darker on hover */
            border-color: #233140;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <div class="card-body">
                        <h2 class="card-title text-center text-primary-orange mb-4">
                            {% if form.instance.pk %}Edit Event{% else %}Add Event{% endif %}
                        </h2>
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary-orange">
                                    Save
                                </button>
                                <a href="{% url 'events:calendar' %}" class="btn btn-secondary-dark">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
