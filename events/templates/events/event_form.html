{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Edit Event{% else %}Add Event{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Light grey background */
            color: #212529; /* Dark text color */
        }
        .card {
            background-color: #ffffff; /* White card background */
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            background-color: #f8f9fa; /* Light grey input fields */
            color: #212529;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            background-color: #f8f9fa;
            color: #212529;
            border-color: #dc3545; /* Red focus outline */
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
        .btn-primary-red {
            background-color: #dc3545; /* Red button */
            border-color: #dc3545;
            color: #fff;
            transition: background-color 0.2s ease-in-out;
        }
        .btn-primary-red:hover {
            background-color: #c82333; /* Darker red on hover */
            border-color: #c82333;
        }
        .btn-secondary-light {
            background-color: #e9ecef; /* Light grey secondary button */
            border-color: #e9ecef;
            color: #212529;
        }
        .btn-secondary-light:hover {
            background-color: #dee2e6; /* Slightly darker on hover */
            border-color: #dee2e6;
        }
        .text-red {
            color: #dc3545 !important;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <div class="card-body">
                        <h2 class="card-title text-center text-red mb-4">
                            {% if form.instance.pk %}Edit Event{% else %}Add New Event{% endif %}
                        </h2>
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary-red">
                                    Save
                                </button>
                                <a href="{% url 'events:calendar' %}" class="btn btn-secondary-light">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
