{% load static %}
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Scanner</title>
  	
	<!-- FAVICONS ICON -->	
	
    {% if school_info and school_info.logo %}
		<link rel="icon" href="{{ school_info.logo.url }}" type="image/png">
	{% else %}
		<link rel="icon" href="{% static 'pages/images/favicon.png' %}" type="image/png">
	{% endif %}
	

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body {
            background: #f4f6f9;
            font-family: "Segoe UI", sans-serif;
        }

        .header {
            background: linear-gradient(135deg,#0d6efd,#0b5ed7);
            color: white;
            padding: 25px;
            border-radius: 15px;
        }

        #reader {
            border-radius: 15px;
            overflow: hidden;
        }

        .card-box {
            border: none;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

<div class="container py-4">

    <!-- HEADER -->
    <div class="header mb-3">

        <h3>
            <i class="fas fa-qrcode me-2"></i>
            Staff Attendance Scanner
        </h3>

        <small>Scan staff QR for check-in/out</small>

    </div>

    <!-- STATS -->
    <div class="row mb-3">

        <div class="col-md-6">
            <div class="card card-box p-3 bg-primary text-white">
                Total Staff: {{ total_staff }}
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-box p-3 bg-success text-white">
                Present Today: <span id="present-count">{{ present_count }}</span>
            </div>
        </div>

    </div>

    <!-- SCANNER -->
    <div class="card card-box p-3">

        <div id="reader"></div>

        <div id="result" class="mt-3"></div>

    </div>

</div>

<script>

function onScanSuccess(decodedText) {

    fetch(`/attendance/scan-staff/${decodedText}/`)
    .then(res => res.json())
    .then(data => {

        document.getElementById("result").innerHTML =
            `<div class="alert alert-info">${data.message}</div>`;

        document.getElementById("present-count").innerText =
            data.present_count;

    });

}

new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 })
    .render(onScanSuccess);

</script>

</body>

</html>
