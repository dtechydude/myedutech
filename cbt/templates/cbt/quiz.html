{% extends 'cbt/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-3">
    <div class="row">
        <div class="col">
            <b>Exam: {{obj.exam_name}}</b>
        </div>
        <div class="col text-right" id="timer-box">
            </div>
    </div>

    <form id="quiz-form" class="mt-4">
        {% csrf_token %}
        <div id="quiz-box">
            </div>
        <button type="submit" class="btn btn-primary mt-3" id="submit-btn">Finish Exam</button>
    </form>

    <div id="result-box" class="mt-5 d-none">
        <h3 id="score-text"></h3>
        <div id="details-box"></div>
        <a href="/" class="btn btn-secondary">Back to Dashboard</a>
        {% if user.student %}
        <a href="{% url 'cbt:student-results-view' %}" class="btn btn-outline-primary">
            📊 View My Result History
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'cbt/quiz.js' %}" defer></script>
{% endblock %}
