{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scores Saved Successfully</title>
    <!-- Assuming you use Bootstrap 5 for styling -->
    <link rel="shortcut icon" type="image/png" href="{% static 'pages/images/favicon.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJc5D04085S0gD3X9y39K3Fm3I/5e2p3R5yTjV0n5+p0/N5m5x5q5q5q5q5q5q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-lg border-success">
                    <div class="card-header bg-success text-white text-center">
                        <h3 class="mb-0">✅ Scores Saved Successfully</h3>
                    </div>
                    <div class="card-body text-center p-4">
                        
                        <h4 class="card-title text-success mb-4">Update Complete!</h4>
                        <p class="lead">
                            Mid-Term Scores for **{{ subject.name }}** in **{{ assigned_class.name }}** for **{{ term.name }}** have been successfully updated.
                        </p>

                        <hr class="my-4">

                        <div class="d-grid gap-3">
                            <!-- Option 1: The preferred choice (Return to selection) -->
                            <a href="{% url 'results:midterm_score_selection' %}" 
                               class="btn btn-success btn-lg">
                                <i class="fas fa-list-check me-2"></i> Select Next Subject/Class
                            </a>
                            
                            <!-- Option 2: The fallback (Return to the page just edited) -->
                            <a href="{% url 'results:midterm_score_entry' class_id=class_id subject_id=subject_id term_id=term_id %}" 
                               class="btn btn-outline-secondary btn-md">
                                <i class="fas fa-undo me-2"></i> Return to **{{ subject.name }}** Entry
                            </a>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Optional: Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
