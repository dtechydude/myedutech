{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Entry Selection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f8f9fc; min-height: 100vh; font-family: 'Nunito', sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); }
        .card-header { background-color: #4e73df; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; font-weight: bold; }
        .form-control-lg { border-radius: 10px; font-size: 1rem; }
        .btn-proceed { background-color: #1cc88a; border: none; color: white; font-weight: 700; padding: 12px; border-radius: 10px; width: 100%; transition: all 0.3s; }
        .btn-proceed:hover { background-color: #17a673; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="text-dark font-weight-bold mb-0">Score Entry Portal</h4>
        <a href="{% url 'pages:portal-home' %}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert">&times;</button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card">
        <div class="card-header text-center py-3">
            <i class="fas fa-filter mr-2"></i> Select Entry Parameters
        </div>
        <div class="card-body p-4">
            <form id="selection-form">
                <div class="form-group mb-4">
                    <label class="text-xs font-weight-bold text-primary text-uppercase mb-1">Assigned Class</label>
                    <select id="id_class" class="form-control form-control-lg" required>
                        <option value="">-- Select Class --</option>
                        {% for std in available_classes %}
                            <option value="{{ std.id }}">{{ std.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label class="text-xs font-weight-bold text-primary text-uppercase mb-1">Assigned Subject</label>
                    <select id="id_subject" class="form-control form-control-lg" required>
                        <option value="">-- Select Subject --</option>
                        {% for sub in available_subjects %}
                            <option value="{{ sub.id }}">{{ sub.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label class="text-xs font-weight-bold text-primary text-uppercase mb-1">Academic Term</label>
                    <select id="id_term" class="form-control form-control-lg" required>
                        {% for term in available_terms %}
                            <option value="{{ term.id }}" {% if term.is_current %}selected{% endif %}>
                                {{ term.name }} ({{ term.session.name }})
                            </option>
                        {% endfor %}
                    </select>
                    {% if not available_terms %}
                        <small class="text-danger">No active term found.</small>
                    {% endif %}
                </div>

                <button type="button" class="btn btn-proceed mt-3" onclick="handleNavigation()">
                    Proceed to Score Sheet <i class="fas fa-chevron-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function handleNavigation() {
        const classId = document.getElementById('id_class').value;
        const subjectId = document.getElementById('id_subject').value;
        const termId = document.getElementById('id_term').value;

        if (classId && subjectId && termId) {
            // This builds the URL based on your results:midterm_score_entry path
            // Format: /results/midterm/entry/class_id/subject_id/term_id/
            let entryUrl = "{% url 'results:midterm_score_entry' class_id=0 subject_id=0 term_id=0 %}";
            
            // Cleanly replace the placeholder '0/0/0' with actual IDs
            entryUrl = entryUrl.replace('0/0/0', `${classId}/${subjectId}/${termId}`);
            
            window.location.href = entryUrl;
        } else {
            alert("Please ensure all parameters are selected before proceeding.");
        }
    }
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
