{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Portal</title>

    <link rel="icon" type="image/png" href="{% static 'pages/images/favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #0A2647;
            --orange: #FF6700;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-blue);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .landing-container {
            max-width: 600px;
            padding: 2rem;
        }
        .logo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .logo-container img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }
        .tagline small {
            font-size: 0.8rem; /* Makes the text inside small tag even smaller */
        }
        .btn-theme {
            background-color: var(--orange);
            border-color: var(--orange);
            color: var(--white);
            font-weight: 600;
            padding: 0.75rem 2rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-theme:hover {
            background-color: #e55c00;
            border-color: #e55c00;
            color: var(--white);
        }
        .btn-outline-theme {
            background-color: transparent;
            border-color: var(--orange);
            color: var(--orange);
            font-weight: 600;
            padding: 0.75rem 2rem;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-outline-theme:hover {
            background-color: var(--orange);
            color: var(--white);
        }
        .contact-info {
            margin-top: 2rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .contact-info p {
            margin-bottom: 0.5rem;
        }
        .contact-info a {
            color: inherit;
            text-decoration: none;
        }
        .contact-info a:hover {
            color: var(--orange);
        }
    </style>
</head>
<body>

<div class="landing-container">
    <div class="logo-container">
        <img src="{% static 'pages/images/the_school_logo.png' %}" alt="Kwikschool Logo">
    </div>
    <h3 class="brand-name">Kwikschools</h3>
    <p class="tagline">(SMART SCHOOL) <br>
    <span><small>Login To Your Account Or Contact The Admin For A New Account Registration.</small></span></p>

    <div class="d-grid gap-3 col-10 mx-auto">
        <a href="/admin/" class="btn btn-theme btn-lg">
            <i class="fas fa-user-shield me-2"></i> Login (Admin) 
        </a>
        <a href="/dashboard/" class="btn btn-outline-theme btn-lg">
            <i class="fas fa-user me-2"></i> Login (Others)
        </a>
    </div>

    <div class="contact-info">
        <p>
            <i class="fas fa-map-marker-alt me-2"></i> 123 Education Blvd, New City, CA 90210
        </p>
        <p>
            <i class="fas fa-phone-alt me-2"></i> <a href="tel:+15551234567">(555) 123-4567</a>
        </p>
        <p>
            <i class="fas fa-envelope me-2"></i> <a href="mailto:info@kwikschool.com">info@kwikschool.com</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
