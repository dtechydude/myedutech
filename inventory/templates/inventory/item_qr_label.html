{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Label — {{ item.name }}</title>
    <!-- FAVICONS ICON -->	
    {% if school_info and school_info.logo %}
		<link rel="icon" href="{{ school_info.logo.url }}" type="image/png">
	{% else %}
		<link rel="icon" href="{% static 'pages/images/school_logo.jpg' %}" type="image/png">
	{% endif %}

    <script src="{% static 'vendor/qrcodejs/qrcode.min.js' %}"></script>
    <style>
        body { font-family: Arial, sans-serif; background:#f1f5f9; margin:0; padding:20px; }
        .label {
            width: 60mm; height: 40mm; background:#fff; border:1px solid #ccc; border-radius:6px;
            padding:6px; display:flex; align-items:center; gap:8px; margin:0 auto 20px;
        }
        .qr-box { width:80px; height:80px; flex-shrink:0; }
        .label-text { font-size:10px; line-height:1.3; overflow:hidden; }
        .label-text strong { font-size:12px; display:block; margin-bottom:2px; }
        .no-print { text-align:center; margin-bottom:20px; }
        @media print {
            .no-print { display:none !important; }
            body { background:#fff; padding:0; }
            .label { border:1px dashed #999; margin:0; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button onclick="window.print()" class="btn" style="padding:8px 20px; cursor:pointer;">🖨️ Print Label</button>
    </div>
    <div class="label">
        <div class="qr-box" id="qrcode"></div>
        <div class="label-text">
            <strong>{{ item.name }}</strong>
            {{ item.category.name|default:"" }}<br>
            ID: INV-{{ item.pk }}
        </div>
    </div>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ scan_url }}",
            width: 80,
            height: 80,
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
